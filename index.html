    const ring=document.createElement('span');ring.className='bite-ring';ring.style.left=x+'px';ring.style.top=y+'px';arena.appendChild(ring);later(()=>ring.remove(),650);arena.classList.remove('shake');void arena.offsetWidth;arena.classList.add('shake');later(()=>arena.classList.remove('shake'),260);

  function tick(time){const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;if(!document.hidden&&!reducedMotion.matches){for(const b of bugs){if(time<b.bitingUntil||b.el===document.activeElement||b.el.matches(':hover'))continue;if(time>b.nextTurn){b.turn+=(Math.random()-.5)*1.5;b.nextTurn=time+2000+Math.random()*3500;}b.x+=Math.sin(b.turn)*b.speed*dt;b.y-=Math.cos(b.turn)*b.speed*dt;const maxX=Math.max(0,width-124*scale),maxY=Math.max(44,height-192*scale-35);if(b.x<0||b.x>maxX){b.x=Math.max(0,Math.min(maxX,b.x));b.turn=-b.turn;}if(b.y<44||b.y>maxY){b.y=Math.max(44,Math.min(maxY,b.y));b.turn=Math.PI-b.turn;}const target=b.turn*180/Math.PI;const diff=((target-b.angle+540)%360)-180;b.angle+=diff*dt*2;render(b);}}frame=requestAnimationFrame(tick);}
  function reset(){stopSounds();for(const t of timers)clearTimeout(t);timers.clear();bugs.forEach(b=>b.el.remove());bugs=[];arena.querySelectorAll('.shout,.bite-ring').forEach(n=>n.remove());arena.classList.remove('shake');bites=0;nextId=0;score.value='00';reaction.textContent=reactions[0];document.getElementById('announce').textContent='Нова гра. Укусів: 0.';measure();for(let i=0;i<4;i++)addBug();}
  soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.setAttribute('aria-label',soundOn?'Вимкнути звук':'Увімкнути звук');document.getElementById('sound-label').textContent=soundOn?'Звук увімкнено':'Звук вимкнено';if(!soundOn)stopSounds();});
  addButton.addEventListener('click',addBug);document.getElementById('reset').addEventListener('click',reset);new ResizeObserver(measure).observe(arena);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSounds();lastTime=performance.now();});window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);stopSounds();});reset();frame=requestAnimationFrame(tick);
})();
</script>
